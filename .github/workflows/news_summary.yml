name: AI News Summary to Telegram

on:
  repository_dispatch:
    types: [zapier_trigger]
  workflow_dispatch:
    # Manual trigger untuk testing

jobs:
  news-summary:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news summary script
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.event.client_payload.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ github.event.client_payload.telegram_channel_id || secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEYS: ${{ github.event.client_payload.gemini_api_keys || secrets.GEMINI_API_KEYS }}  # Comma-separated list of API keys (recommended)
          GEMINI_API_KEY: ${{ github.event.client_payload.gemini_api_key || secrets.GEMINI_API_KEY }}  # Fallback for single key (deprecated)
          RSS_FEED_URLS: ${{ github.event.client_payload.rss_feed_urls || secrets.RSS_FEED_URLS }}  # Comma-separated list of RSS feeds (recommended)
          RSS_FEED_URL: ${{ github.event.client_payload.rss_feed_url || secrets.RSS_FEED_URL }}  # Fallback for single feed (deprecated)
          CLOUDFLARE_WORKER_URL: ${{ github.event.client_payload.cloudflare_worker_url || secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDFLARE_WORKER_API_KEY: ${{ github.event.client_payload.cloudflare_worker_api_key || secrets.CLOUDFLARE_WORKER_API_KEY }}
          SUMMARY_MAX_LENGTH: ${{ github.event.client_payload.summary_max_length || secrets.SUMMARY_MAX_LENGTH || '1500' }}
          TAVILY_API_KEY: ${{ github.event.client_payload.tavily_api_key || secrets.TAVILY_API_KEY }}
          MAX_ARTICLES_PER_RUN: ${{ github.event.client_payload.max_articles_per_run || secrets.MAX_ARTICLES_PER_RUN || '5' }}
        run: python main.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-summary-logs
          path: |
            logs/
            data/
          retention-days: 7
